spring:
  application:
    name: pwr-backend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.pwrsim: DEBUG
    org.apache.commons.math3: WARN
    no.ntnu.idi.fmi4j: WARN

# ====== REACTOR SIMULATION CONFIG ======
reactor:
  simulation:
    # Time step for ODE integration (seconds)
    timeStep: 0.01
    
    # Maximum simulation duration (seconds)
    maxSimulationTime: 3600
    
    # Persist state snapshots to database
    persistState: true
    
    # Verbose transient logging
    logTransients: false
    
    # FMI coupling configuration
    fmi:
      # Enable FMI coupling to external models
      enabled: false
      
      # Path to FMU files (SAM, Modelica, etc.)
      fmuPath: /opt/fmu/
      
      # Supported external models
      externalModels:
        - name: SAM
          fmuFile: sam_model.fmu
          type: CoSimulation
          enabled: false
        
        - name: ThermoPower
          fmuFile: thermopower_model.fmu
          type: CoSimulation
          enabled: false
        
        - name: OpenMC
          fmuFile: openmc_coupling.fmu
          type: CoSimulation
          enabled: false
    
    # Numerical solver configuration
    solvers:
      ode:
        # Dormand-Prince 5(4) integrator
        minStep: 1e-8
        maxStep: 0.1
        absoluteTolerance: 1e-6
        relativeTolerance: 1e-8
    
    # Matrix computation (ND4J)
    matrix:
      # Use GPU acceleration if available
      useGpu: false
      
      # Fallback to native CPU
      backend: CPU
    
    # Database configuration for state history
    database:
      # Keep last N state snapshots in memory
      stateHistorySize: 10000
      
      # Archive old states to disk
      archiveAfterDays: 30
    
    # Safety and operational limits
    operationalLimits:
      maxPower: 100.0           # % of nominal
      minPower: 5.0             # %
      maxCoreTemp: 360.0        # °C
      minCoreTemp: 260.0        # °C
      maxPrimaryPressure: 17.5  # MPa
      minPrimaryPressure: 13.5  # MPa
      maxPressurizerLevel: 80.0 # %
      minPressurizerLevel: 20.0 # %
    
    # Safety system setpoints
    safetySetpoints:
      pressureHighSetpoint: 17.8        # MPa (Safety Injection)
      pressureLowSetpoint: 13.2         # MPa (Low pressure injection)
      tempHighSetpoint: 360.0           # °C (High temp scram)
      coreFlowLowSetpoint: 90.0         # % (Low flow scram)
